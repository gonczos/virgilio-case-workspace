emailVerificationSubject=Your invitation to Virgilio Consultation
emailVerificationBody=A Virgilio Consultation account has been created for you.\n\nTo accept the invitation and verify your email address, click the link below:\n\n{0}\n\nThis invitation link will expire within {3}.\n\nDuring setup, you will be asked to:\n\n1. Create your password.\n2. Configure an authenticator app (Google Authenticator or similar).\n3. Enter the authentication code from the Authenticator to confirm the setup.\n\nWhen setup is complete, you will be taken to the Virgilio Consultation site.\n\nIf you were not expecting this invitation, do not use the link and contact the administrator.
emailVerificationBodyHtml=<p>A Virgilio Consultation account has been created for you.</p><p>To accept the invitation and verify your email address, click the link below:</p><p><a href="{0}"><strong>Verify email and continue</strong></a></p><p>This invitation link will expire within {3}.</p><p>During setup, you will be asked to:</p><ol><li>Create your password.</li><li>Configure an authenticator app (Google Authenticator or similar).</li><li>Enter the authentication code from the Authenticator to confirm the setup.</li></ol><p>When setup is complete, you will be taken to the Virgilio Consultation site.</p><p>If you were not expecting this invitation, do not use the link and contact the administrator.</p>
