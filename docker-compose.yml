services:
  db:
    image: postgres:16-bookworm
    container_name: virgilio-case-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11.5.1
    container_name: virgilio-case-directus
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8055:8055"
    volumes:
      - ./data/storage:/directus/uploads
      - ./app/extensions:/directus/extensions
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: http://localhost:8055

  gateway:
    image: node:22-bookworm-slim
    container_name: virgilio-case-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace
    command: ["node", "./app/file-gateway.mjs"]
    ports:
      - "8090:8090"
    volumes:
      - ./:/workspace
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      FILE_GATEWAY_PORT: 8090
